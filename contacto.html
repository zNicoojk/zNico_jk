<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101018" />
  <meta name="description" content="Contacta a zNico_jk para solicitar algo personalizado." />
  <title>Solicita proyecto · zNico_jk</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --text: #fff;
      --muted: #d4cfdf;
      --border: rgb(255 255 255 / 17%);
    }
    * { box-sizing: border-box; }
    html, body { min-width: 320px; min-height: 100%; margin: 0; background: #101018; }
    body { min-height: 100vh; min-height: 100svh; color: var(--text); }
    .backdrop { position: fixed; z-index: 0; inset: 0; overflow: hidden; pointer-events: none; }
    .backdrop::before { position: absolute; inset: 0; content: ""; background: url("assets/wallpaper-jett.png") center / cover no-repeat; }
    .backdrop::after { position: absolute; inset: 0; content: ""; background: linear-gradient(180deg, rgb(5 12 17 / 42%), rgb(7 14 11 / 68%)); }
    main {
      position: relative;
      z-index: 1;
      display: flex;
      min-height: 100vh;
      min-height: 100svh;
      flex-direction: column;
      justify-content: center;
      width: min(100%, 600px);
      margin: auto;
      padding: max(32px, calc(env(safe-area-inset-top, 0px) + 24px)) max(24px, calc(env(safe-area-inset-right, 0px) + 24px)) max(28px, calc(env(safe-area-inset-bottom, 0px) + 20px)) max(24px, calc(env(safe-area-inset-left, 0px) + 24px));
    }
    header { margin-bottom: 24px; text-align: center; }
    h1 { margin: 0; font-size: clamp(28px, 7vw, 42px); line-height: 1.1; letter-spacing: -.04em; }
    header p { max-width: 42ch; margin: 12px auto 0; color: rgb(240 238 248 / 85%); font-size: 15px; line-height: 1.6; }
    .contacts { display: grid; gap: 12px; }
    .contact {
      display: flex;
      min-height: 68px;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border: 1px solid var(--border);
      border-radius: 18px;
      color: var(--text);
      text-decoration: none;
      background: rgb(255 255 255 / 3%);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      transition: transform .18s ease, background-color .18s ease, border-color .18s ease;
      touch-action: manipulation;
    }
    .contact:hover { transform: translateY(-2px); border-color: rgb(169 243 255 / 65%); background: rgb(169 243 255 / 9%); }
    .contact:focus-visible, .back:focus-visible { outline: 3px solid #a9f3ff; outline-offset: 3px; }
    .contact strong { display: block; font-size: 15px; }
    .contact small { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; }
    .arrow { color: #d2cde0; font-size: 20px; }
    .back { align-self: center; margin-top: 24px; color: #c6f7ff; font-size: 14px; text-underline-offset: 4px; }
    @media (max-width: 480px) { main { padding-right: 18px; padding-left: 18px; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <main>
    <header>
      <h1>Solicita tu personalizado</h1>
      <p>¿Tienes una idea? Escríbeme por cualquiera de estos medios y cuéntame qué te gustaría tener.</p>
    </header>
    <nav class="contacts" aria-label="Medios de contacto">
      <a class="contact" href="https://discord.gg/2xyQvptDp4" target="_blank" rel="noopener noreferrer">
        <span><strong>Discord</strong><small>Envíame un mensaje</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="contact" href="https://instagram.com/znico_jk" target="_blank" rel="noopener noreferrer">
        <span><strong>Instagram</strong><small>Escríbeme por mensaje directo</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
      <a class="contact" href="https://mail.google.com/mail/?view=cm&amp;fs=1&amp;to=zNicoDev%40gmail.com" target="_blank" rel="noopener noreferrer">
        <span><strong>Correo</strong><small>zNicoDev@gmail.com</small></span>
        <span class="arrow" aria-hidden="true">↗</span>
      </a>
    </nav>
    <a class="back" href="index.html">← Volver a mis enlaces</a>
  </main>
</body>
</html>
